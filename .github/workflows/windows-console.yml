name: windows console
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build numpy psutil pywinpty==3.1.2 pyte==0.8.2
      - name: Use the pip that stock Python 3.10 ships (no distlib WRAPPERS)
        if: matrix.python == '3.10'
        run: python -m pip install pip==23.0.1
      - run: python -m build --wheel
      - name: Drive the installed launcher through ConPTY and a conhost window
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          python examples\windows_console_check.py --wheel $wheel --work-dir "$env:RUNNER_TEMP\console check" --output console-result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-console-${{ matrix.os }}-py${{ matrix.python }}
          path: console-result.json
