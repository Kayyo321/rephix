name: platform probe
on:
  push:
    branches: ['release/**']
    paths: ['.github/workflows/platform-probe.yml']
permissions:
  contents: read
jobs:
  mps:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: uname -a; sw_vers; sysctl -n machdep.cpu.brand_string; sysctl hw.memsize; system_profiler SPDisplaysDataType || true
      - run: python -m pip install torch numpy
      - name: MPS execution probe
        run: |
          python - <<'PY'
          import time, torch, platform
          print("torch", torch.__version__, platform.mac_ver())
          print("built", torch.backends.mps.is_built(), "available", torch.backends.mps.is_available())
          if torch.backends.mps.is_available():
              x = torch.randn(2048, 2048, device="mps")
              torch.mps.synchronize(); t=time.perf_counter()
              for _ in range(20): y = x @ x
              torch.mps.synchronize(); print("mps matmul s", time.perf_counter()-t, y.device)
              print("allocated", torch.mps.current_allocated_memory(), "driver", torch.mps.driver_allocated_memory())
              c = x.cpu(); t=time.perf_counter()
              for _ in range(20): z = c @ c
              print("cpu matmul s", time.perf_counter()-t)
              print("maxdiff", (y.cpu()-z).abs().max().item())
          PY
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: cmd /c ver; [Environment]::OSVersion; $PSVersionTable; Get-Command wt -ErrorAction SilentlyContinue; Get-Command pwsh
      - run: python -m pip install pywinpty pyte
      - name: ConPTY probe
        run: |
          python -c "import winpty,time; p=winpty.PtyProcess.spawn('cmd.exe /c echo héllo ✓ & set /p X=name: & echo got %X%', dimensions=(24,80)); time.sleep(2); print(repr(p.read(4000))); p.write('abc\r\n'); time.sleep(2); print(repr(p.read(4000))); print('alive', p.isalive())"
