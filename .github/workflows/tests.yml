name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,tui]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: rephix demo
  hf-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,hf,diffusion,analysis,tui]'
      - run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          MPLCONFIGDIR: /tmp/rephix-mpl
      - run: rephix offline-trial --output runs/ci-offline --steps 2
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          MPLCONFIGDIR: /tmp/rephix-mpl
      - uses: actions/upload-artifact@v4
        with:
          name: offline-research-report
          path: |
            runs/ci-offline/trial.json
            runs/ci-offline/trial.md
            runs/ci-offline/test.json
            runs/ci-offline/comparison/
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build numpy
      - run: python -m build
      - run: python -m pip install dist/rephix-0.3.0-py3-none-any.whl
      - run: python examples/installation_smoke_check.py --wheel dist/rephix-0.3.0-py3-none-any.whl --work-dir lifecycle-trial --output lifecycle-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle-result.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/rephix-wheel
      - run: /tmp/rephix-wheel/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/rephix-wheel/bin/rephix demo
      - run: cd /tmp && /tmp/rephix-wheel/bin/rephix doctor
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
