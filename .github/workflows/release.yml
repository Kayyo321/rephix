name: release artifacts
# Build once from an exact commit, verify, and hand the same bytes to the release.
# Publishing never rebuilds or overwrites assets: the published event only verifies.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to build release assets from
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require an exact commit SHA
        env:
          REF: ${{ inputs.ref }}
        run: echo "$REF" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Build wheel, sdist, installer, build info and SHA256SUMS
        run: python examples/build_release_assets.py --output release-assets
      - name: Check the build commit matches the requested SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          test "$(python -c "import json;print(json.load(open('release-assets/BUILD-INFO.json'))['commit'])")" = "$REF"
          cd release-assets && sha256sum --check SHA256SUMS
      - name: Smoke-install the wheel outside the checkout
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install release-assets/rephix-*-py3-none-any.whl
          cd /tmp && /tmp/smoke/bin/rephix --version && /tmp/smoke/bin/rephix demo > /dev/null
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/rephix-*.whl
            release-assets/rephix-*.tar.gz
            release-assets/rephix-installer.py
            release-assets/BUILD-INFO.json
            release-assets/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  lifecycle:
    # The same bytes the release will carry, through every lifecycle stage per OS.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}  # validated as an exact SHA by the build job
      - uses: actions/checkout@v4
        with:
          ref: 553bfea6999ec979a602fc7096d4110bb7d320ac
          path: old-0.3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Previous releases (published 0.2.0 bytes; 0.3.0 from its verified commit)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0 --repo "${{ github.repository }}" -p 'rephix-0.2.0-py3-none-any.whl' -D old-0.2
          python -c "import hashlib,sys;d=hashlib.sha256(open('old-0.2/rephix-0.2.0-py3-none-any.whl','rb').read()).hexdigest();sys.exit(d!='870e1d3d51d816e3599bea9d714792c2275e9b154198cd5ce3062bc2a905e2c5')"
          test "$(git -C old-0.3 rev-parse HEAD)" = 553bfea6999ec979a602fc7096d4110bb7d320ac
          python -m pip install build
          python -m build --wheel --outdir old-0.3-dist old-0.3
      - name: Use the pip that stock Python 3.10 ships (no distlib WRAPPERS)
        if: matrix.python == '3.10'
        run: python -m pip install pip==23.0.1
      - name: Install, upgrade, fail, uninstall and reinstall
        shell: bash
        run: python -I examples/release_lifecycle_check.py --assets release-assets --old-wheel-02 old-0.2/rephix-0.2.0-py3-none-any.whl --old-wheel-03 old-0.3-dist/rephix-0.3.0-py3-none-any.whl --installer-03 old-0.3/src/rephix/installation.py --work-dir "$RUNNER_TEMP/lifecycle" --channel mirror --output lifecycle-${{ matrix.os }}-${{ matrix.python }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.os }}-${{ matrix.python }}
          path: lifecycle-*.json

  verify-published:
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the published assets and verify their checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir published && cd published
          gh release download "$TAG" --repo "${{ github.repository }}"
          python - <<'PY'
          import hashlib, json, pathlib, os
          sums = dict(reversed(l.split()) for l in pathlib.Path("SHA256SUMS").read_text().split("\n") if l)
          for name, digest in sums.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          info = json.loads(pathlib.Path("BUILD-INFO.json").read_text())
          assert info["tag"] == os.environ["TAG"], (info, os.environ["TAG"])
          print("verified", sorted(sums))
          PY
      - name: Every asset was built by this repository's release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd published
          for f in *; do
            gh attestation verify "$f" --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          done
      - name: Tag points at the commit the assets were built from
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          built=$(python -c "import json;print(json.load(open('published/BUILD-INFO.json'))['commit'])")
          tagged=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)
          test "$built" = "$tagged"
      - name: Install the published tag through the published installer
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python published/rephix-installer.py install --prefix "$RUNNER_TEMP/rephix app" --release "$TAG" --extras tui
          if [ "$RUNNER_OS" = Windows ]; then L="$RUNNER_TEMP/rephix app/rephix.exe"; else L="$RUNNER_TEMP/rephix app/rephix"; fi
          test "v$("$L" --version)" = "$TAG"
          "$L" demo > /dev/null
          "$L" installation check-update
          "$L" installation uninstall
      - name: The stable channel resolves to this release when it is marked latest
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          echo "latest=$latest tag=$TAG"
          test "$latest" = "$TAG"
