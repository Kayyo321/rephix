[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rephix"
version = "0.2.0"
description = "Experimental model reconstruction and measurable weight recovery from observations"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = ["torch>=2.4", "transformers>=4.46,<5", "safetensors>=0.4"]
diffusion = [
    "torch>=2.4",
    "diffusers>=0.35,<0.36",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.4",
]
gguf = ["gguf>=0.19,<0.20"]
dev = ["pytest>=8", "ruff>=0.9"]
analysis = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/Kayyo321/rephix"
Issues = "https://github.com/Kayyo321/rephix/issues"

[project.scripts]
rephix = "rephix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
