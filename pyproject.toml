[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rephix"
version = "0.1.0"
description = "Experimental model reconstruction and measurable weight recovery from observations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = ["torch>=2.4", "transformers>=4.46,<5", "safetensors>=0.4"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
rephix = "rephix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
